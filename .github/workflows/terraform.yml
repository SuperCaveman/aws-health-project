name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches: [master]
    paths:
      - "infra/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
